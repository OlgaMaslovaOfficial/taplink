<style>
  :root{--line:#2a2a2a;--soft:#bdbdbd;--muted:#8a8a8a}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#000;color:#f2f2f2;font:300 15px/1.55 "Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  .page{max-width:460px;margin:0 auto;padding:18px 20px 40px;position:relative}
  .top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:baseline;font-family:"Tenor Sans",sans-serif;font-size:14px;letter-spacing:.06em;color:var(--soft)}
  .hero{position:relative;height:clamp(420px,118vw,540px);margin:18px -20px 0}
  .hero figure{position:absolute;margin:0;overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05) brightness(.82)}
  .hero .c{left:26%;width:48%;top:0;height:84%}
  .hero .c img{object-position:50% 30%}
  .hero .l{left:4%;width:30%;top:24%;height:56%;z-index:1}
  .hero .l img{object-position:40% 25%}
  .hero .r{right:4%;width:30%;top:34%;height:52%;z-index:1}
  .hero .r img{object-position:55% 28%}
  .hero figure::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%)}
  .hero .name{position:absolute;left:20px;right:20px;bottom:0;margin:0;z-index:3;text-shadow:0 2px 24px rgba(0,0,0,.6)}
  .photo{position:relative;z-index:1;display:block;width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1);margin-top:22px}
  .name{position:relative;z-index:1;font-family:"Tenor Sans",sans-serif;font-weight:400;line-height:.95;letter-spacing:.06em;margin:70px 0 0}
  .name span{display:block;font-size:clamp(46px,15vw,72px)}
  .name span+span{padding-left:16%}
  .photo:not(.hide)+.name{margin-top:-60px}
  .page>*{position:relative;z-index:1}
  .motto span{display:block;white-space:nowrap}
  .motto span:last-child{margin-top:6px}
  .hero+.tag{margin-top:22px}
  .tag{position:relative;z-index:1;margin-top:18px;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .motto{position:relative;z-index:1;font-family:"Tenor Sans",sans-serif;font-size:clamp(16px,5vw,20px);line-height:1.35;color:#fff;border-left:1px solid #fff;padding-left:14px;margin:18px 0 28px}
  h2{font:700 10px "Montserrat",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .btn{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #3a3a3a;padding:15px 16px;margin:8px 0;color:#fff;text-decoration:none;transition:background .2s,border-color .2s}
  .btn:hover,.btn:focus-visible{background:#fff;color:#000;border-color:#fff;outline:none}
  .btn .l{font-family:"Tenor Sans",sans-serif;font-size:17px;letter-spacing:.06em}
  .btn .s{font-size:11px;color:var(--muted);letter-spacing:.06em;text-align:right}
  .btn:hover .s{color:#333}
  .btn.main{background:#fff;color:#000;border-color:#fff}
  .btn.main .s{color:#444}
  .btn.main:hover{background:#000;color:#fff}
  .btn.main:hover .s{color:var(--muted)}
  .show{border-bottom:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:72px 1fr;gap:12px}
  .show b{font-family:"Tenor Sans",sans-serif;font-weight:400;font-size:16px;color:#fff}
  .show .w{color:#e4e4e4}
  .show .p{font-size:12px;color:var(--muted)}
  .show a{color:#fff}
  footer{margin-top:34px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center}
  .hide{display:none!important}
  #sparkles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .page{z-index:1}
  .btn{background:#000}
  .lang{display:flex;gap:6px}
  .lang button{font:700 10px "Montserrat",sans-serif;letter-spacing:.16em;color:#8a8a8a;background:none;border:1px solid #333;padding:5px 8px;cursor:pointer}
  .lang button.on{color:#000;background:#fff;border-color:#fff}
  .fn{font-size:11px;line-height:1.5;color:#8a8a8a;margin:10px 0 0}
</style>

      var box=document.getElementById(g); box.innerHTML="";
      CONFIG.links.filter(function(l){return l.group===g && l.url;}).forEach(function(l){
        var a=el("a","btn"+(l.main?" main":"")); a.href=l.url; a.target="_blank"; a.rel="noopener";
        var s1=el("span","l"); s1.textContent=l[lang]+(l.meta?"*":"");
        var s2=el("span","s"); s2.textContent=lang==="ru"?l.noteRu:l.noteEn;
        a.appendChild(s1); a.appendChild(s2); box.appendChild(a);
      });
    });
    var sb=document.getElementById("season-box"), sl=document.getElementById("season"); sl.innerHTML="";
    sb.classList.toggle("hide", !CONFIG.season.length);
    CONFIG.season.forEach(function(x){
      var r=el("div","show"), d=el("b"); d.textContent=x.date; var w=el("div");
      var t=el("div","w"); t.textContent=x[lang]||x.en; var p=el("div","p"); p.textContent=x.place||"";
      w.appendChild(t); w.appendChild(p);
      if(x.url){ var a=el("a"); a.href=x.url; a.target="_blank"; a.rel="noopener"; a.textContent=T.tickets; w.appendChild(a); }
      r.appendChild(d); r.appendChild(w); sl.appendChild(r);
    });
  }
  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click",function(){ lang=b.getAttribute("data-l"); try{localStorage.setItem("om-lang",lang);}catch(e){} render(); });
  });
  render();
})();
</script>
<script>
/* Мерцающие блики на чёрном фоне */
(function(){
  var c=document.getElementById("sparkles"); if(!c||!c.getContext) return;
  var x=c.getContext("2d"), dpr=Math.min(window.devicePixelRatio||1,2), W=0, H=0, stars=[], raf=null;
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ W=c.clientWidth; H=c.clientHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.round(Math.min(70,Math.max(28,W*H/14000))); stars=[]; for(var i=0;i<n;i++) stars.push(make(true)); }
  function make(init){ return {x:Math.random()*W, y:Math.random()*H, r:0.6+Math.random()*1.6,
    life:0, dur:2500+Math.random()*4500, delay:init?Math.random()*6000:Math.random()*2500, max:0.35+Math.random()*0.55, cross:Math.random()<0.18}; }
  function draw(s,a){
    var g=x.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*6);
    g.addColorStop(0,"rgba(255,255,255,"+a+")"); g.addColorStop(0.25,"rgba(255,255,255,"+(a*0.35)+")"); g.addColorStop(1,"rgba(255,255,255,0)");
    x.fillStyle=g; x.beginPath(); x.arc(s.x,s.y,s.r*6,0,Math.PI*2); x.fill();
    if(s.cross){ x.strokeStyle="rgba(255,255,255,"+(a*0.5)+")"; x.lineWidth=0.6; var L=s.r*9*a;
      x.beginPath(); x.moveTo(s.x-L,s.y); x.lineTo(s.x+L,s.y); x.moveTo(s.x,s.y-L); x.lineTo(s.x,s.y+L); x.stroke(); }
  }
  /* Падающие звёзды: редкие, по диагонали, с мягким хвостом */
  var meteors=[], nextM=1500+Math.random()*2500;
  function meteor(){ var ang=(18+Math.random()*22)*Math.PI/180, dir=Math.random()<0.5?1:-1;
    return {x:Math.random()*W, y:Math.random()*H*0.85, vx:Math.cos(ang)*dir, vy:Math.sin(ang),
      sp:0.45+Math.random()*0.4, len:90+Math.random()*120, life:0, dur:900+Math.random()*900, max:0.55+Math.random()*0.35}; }
  function drawM(m){ var p=m.life/m.dur, a=m.max*Math.sin(Math.PI*Math.min(p,1)), d=m.life*m.sp;
    var hx=m.x+m.vx*d, hy=m.y+m.vy*d, L=m.len*(0.4+0.6*Math.sin(Math.PI*Math.min(p,1))), tx=hx-m.vx*L, ty=hy-m.vy*L;
    var g=x.createLinearGradient(hx,hy,tx,ty); g.addColorStop(0,"rgba(255,255,255,"+a+")"); g.addColorStop(1,"rgba(255,255,255,0)");
    x.strokeStyle=g; x.lineWidth=1.2; x.lineCap="round"; x.beginPath(); x.moveTo(hx,hy); x.lineTo(tx,ty); x.stroke();
    var h=x.createRadialGradient(hx,hy,0,hx,hy,4); h.addColorStop(0,"rgba(255,255,255,"+a+")"); h.addColorStop(1,"rgba(255,255,255,0)");
    x.fillStyle=h; x.beginPath(); x.arc(hx,hy,4,0,Math.PI*2); x.fill(); }
  var last=performance.now();
  function tick(t){ var dt=Math.min(t-last,60); last=t; x.clearRect(0,0,W,H);
    nextM-=dt; if(nextM<=0){ meteors.push(meteor()); if(Math.random()<0.2) meteors.push(meteor()); nextM=2500+Math.random()*4500; }
    for(var j=meteors.length-1;j>=0;j--){ var m=meteors[j]; m.life+=dt; if(m.life>=m.dur){ meteors.splice(j,1); continue; } drawM(m); }
    for(var i=0;i<stars.length;i++){ var s=stars[i];
      if(s.delay>0){ s.delay-=dt; continue; }
      s.life+=dt; var p=s.life/s.dur; if(p>=1){ stars[i]=make(false); continue; }
      draw(s, s.max*Math.sin(Math.PI*p));
    }
    raf=requestAnimationFrame(tick);
  }
  function still(){ x.clearRect(0,0,W,H); stars.forEach(function(s){ draw(s,s.max*0.6); }); }
  size(); window.addEventListener("resize",function(){ size(); if(reduce) still(); });
  if(reduce){ still(); return; }
  document.addEventListener("visibilitychange",function(){ if(document.hidden){ cancelAnimationFrame(raf); raf=null; } else if(!raf){ last=performance.now(); raf=requestAnimationFrame(tick); } });
  raf=requestAnimationFrame(tick);
})();
</script>
